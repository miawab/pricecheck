# Environment for GitLab Duo flows working on this repo (read from the default branch only).
# The flow sandbox has no internet, so the test tools come from pure-Python wheels kept in
# .gitlab/duo/wheels (pytest, requests, sentry-sdk). They are unpacked without pip.
# pandas/numpy aren't there, so tests/test_pricing.py is skipped in the sandbox; the pipeline runs it.
setup_script:
  - python3 -c "import glob,zipfile; [zipfile.ZipFile(w).extractall('/tmp/pcdeps') for w in glob.glob('.gitlab/duo/wheels/*.whl')]"
  - printf '#!/bin/sh\nPYTHONPATH=/tmp/pcdeps exec python3 "$@"\n' > /usr/local/bin/pc-python
  - chmod +x /usr/local/bin/pc-python
  - pc-python -m pytest --version
