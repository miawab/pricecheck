# Environment for GitLab Duo flows working on this repo (read from the default branch only).
# Gives agents Python and the test dependencies, so they can run the same tests as the pipeline.
setup_script:
  - command -v python3 >/dev/null || (apt-get update -qq && apt-get install -y -qq python3 python3-venv python3-pip)
  - python3 -m venv /tmp/venv
  - /tmp/venv/bin/pip install -q -r requirements-ci.txt
  - ln -sf /tmp/venv/bin/python /usr/local/bin/pc-python

cache:
  key:
    files: [requirements-ci.txt]
  paths:
    - .cache/pip
